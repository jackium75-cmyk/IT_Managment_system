{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="page-header mb-3"><nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="{{ asset.get_absolute_url }}">{{ asset.tag }}</a></li></ol></nav><h1>{{ heading }}</h1></div>
<form method="post" novalidate class="card" style="max-width: 560px;">{% csrf_token %}
  <div class="card-body">{% include "includes/form_body.html" %}</div>
  <div class="card-footer bg-white d-flex gap-2"><button class="btn {{ button_class|default:'btn-primary' }}" type="submit">{{ button }}</button><a class="btn btn-outline-secondary" href="{{ asset.get_absolute_url }}">Cancel</a></div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="page-header mb-3">
  <nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="{% url 'accounts:user_list' %}">Users</a></li><li class="breadcrumb-item"><a href="{% url 'accounts:user_detail' obj.pk %}">{{ obj.username }}</a></li></ol></nav>
  <h1>Reset password for {{ obj.get_full_name|default:obj.username }}</h1>
</div>
<form method="post" novalidate class="card" style="max-width: 560px;">{% csrf_token %}
  <div class="card-body">{% include "includes/form_body.html" %}</div>
  <div class="card-footer bg-white d-flex gap-2"><button class="btn btn-primary" type="submit">Set password</button>
    <a class="btn btn-outline-secondary" href="{% url 'accounts:user_detail' obj.pk %}">Cancel</a></div>
</form>
{% endblock %}
